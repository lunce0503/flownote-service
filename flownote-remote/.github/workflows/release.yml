name: Build and Release Apps
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build tested standalone Windows EXE
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Exercise the exact packaged executable
        shell: pwsh
        run: |
          $version = node scripts/check-release.mjs
          $executable = "artifacts/Flownote-Remote-$version-windows-x64.exe"
          $testDir = Join-Path $env:RUNNER_TEMP 'FlownoteRemotePackage'
          New-Item -ItemType Directory -Path $testDir | Out-Null
          Copy-Item $executable $testDir
          if ((Get-ChildItem $testDir -File).Count -ne 1) { throw 'Smoke must run with only the release EXE present' }
          ./scripts/smoke-windows.ps1 -Executable (Join-Path $testDir "Flownote-Remote-$version-windows-x64.exe")
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/Flownote-Remote-*-windows-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-ux
          path: artifacts/ux/*.png
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Prepare real server vision worker for device acceptance
        if: github.event_name != 'pull_request'
        run: |
          npm ci --ignore-scripts
          node scripts/prepare-vision.mjs
          npx playwright install --with-deps chromium
      - name: Validate versions and signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWNOTE_REMOTE_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.FLOWNOTE_REMOTE_SIGNING_PASSWORD }}
        run: |
          node scripts/check-release.mjs
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            test -n "$KEYSTORE_BASE64"
            test -n "$SIGNING_PASSWORD"
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flownote-remote.p12"
          fi
      - name: Unit tests, lint and release build
        working-directory: android
        shell: bash
        env:
          FLOWNOTE_REMOTE_SIGNING_PASSWORD: ${{ secrets.FLOWNOTE_REMOTE_SIGNING_PASSWORD }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            export FLOWNOTE_REMOTE_KEYSTORE="$RUNNER_TEMP/flownote-remote.p12"
          fi
          ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Verify and stage exact signed APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          version=$(node scripts/check-release.mjs)
          mkdir -p artifacts
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/Flownote-Remote-$version-android.apk"
      - name: Enable KVM for Android acceptance check
        if: github.event_name != 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open exact signed APK on Android 10
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: |
            bash scripts/smoke-android.sh "artifacts/Flownote-Remote-$(node scripts/check-release.mjs)-android.apk"
            bash scripts/run-network-device-checks.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: android
          path: artifacts/Flownote-Remote-*-android.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: android-ux
          path: artifacts/ux/*.png
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts/release
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: artifacts/release
      - name: Publish verified initial prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/check-release.mjs)
          cd artifacts/release
          sha256sum "Flownote-Remote-$version-android.apk" "Flownote-Remote-$version-windows-x64.exe" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "Flownote-Remote-$version-android.apk" "Flownote-Remote-$version-windows-x64.exe" SHA256SUMS.txt --verify-tag --draft --prerelease --title "Flownote Remote $version · EXE 배포 시험판" --notes-file "../../release-notes/v$version.md"
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" = 3
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
