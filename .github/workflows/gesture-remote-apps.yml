name: Flownote Gesture Remote Apps
on:
  push:
    paths: ['flownote-remote/**', '.github/workflows/gesture-remote-apps.yml']
  pull_request:
    paths: ['flownote-remote/**', '.github/workflows/gesture-remote-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flownote-remote
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: flownote-remote/global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/prepare-vision.mjs
      - run: dotnet run --project tests/Flownote.Remote.Checks -c Release
      - run: dotnet run --project tests/Flownote.Remote.Network.Checks -c Release
      - run: dotnet run --project tests/Flownote.Remote.Windows.Checks -c Release
      - run: dotnet build src/Flownote.Remote.Windows -c Release
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flownote-remote/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
