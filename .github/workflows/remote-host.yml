name: Remote Host

on:
  pull_request:
    paths:
      - "apps/host/**"
      - "protocol/remote-host/**"
      - ".github/workflows/remote-host.yml"
  push:
    branches:
      - main
    tags:
      - "remote-host-v*"
    paths:
      - "apps/host/**"
      - "protocol/remote-host/**"
      - ".github/workflows/remote-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/host/package-lock.json
      - run: npm ci
        working-directory: apps/host
      - run: npm run verify
        working-directory: apps/host

  release:
    if: startsWith(github.ref, 'refs/tags/remote-host-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/host/package-lock.json
      - run: npm ci
        working-directory: apps/host
      - run: npm run verify
        working-directory: apps/host
      - run: npm run package:release -- --out=../../release
        working-directory: apps/host
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "remote-host-v$(node -p "require('./apps/host/package.json').version")"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --notes-file apps/host/RELEASE_NOTES.md --title "Flownote Remote Host ${GITHUB_REF_NAME#remote-host-v}"
          fi
