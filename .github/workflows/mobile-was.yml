name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: flownote/yarn.lock
      - run: yarn install --frozen-lockfile --non-interactive
        working-directory: flownote
      - run: yarn lint
        working-directory: flownote
      - run: yarn build
        working-directory: flownote
      # Cloud E2E runs after staging deploy, not against a previous deployment on PRs.
      - run: node scripts/check-cloud-config.mjs

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: yarn
          cache-dependency-path: flownote-mobile/yarn.lock
      - run: yarn install --frozen-lockfile --non-interactive
        working-directory: flownote-mobile
      - run: yarn verify
        working-directory: flownote-mobile

  fastapi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - directory: flownote-API
            command: uv run pytest -q
          - directory: flownote-ai
            command: uv run pytest -q
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.7
      - run: uv sync --locked --group dev
        working-directory: ${{ matrix.directory }}
      - run: ${{ matrix.command }}
        working-directory: ${{ matrix.directory }}

  spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew test
        working-directory: flownote-server

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - flownote-canvas
          - flownote-serve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache-dependency-path: ${{ matrix.directory }}/go.sum
      - run: go test ./...
        working-directory: ${{ matrix.directory }}

  cloud-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/check-cloud-config.mjs
