name: Remote Android
on:
  push:
    branches: [main]
    tags: ['remote-android-v*']
    paths: ['apps/android/**', 'apps/host/**', 'protocol/remote-host/**', '.github/workflows/remote-android.yml']
  pull_request:
    paths: ['apps/android/**', 'apps/host/**', 'protocol/remote-host/**', '.github/workflows/remote-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Bundle terminal and build Host fixture
        run: |
          npm ci --prefix apps/android/terminal
          npm run build --prefix apps/android/terminal
          npm ci --prefix apps/host
          npm run build --prefix apps/host
          node apps/android/scripts/host-fixture.mjs > "$RUNNER_TEMP/remote-host.log" 2>&1 &
          for i in $(seq 1 30); do
            test -f apps/android/app/src/androidTest/assets/host.json && break
            sleep 1
          done
          test -f apps/android/app/src/androidTest/assets/host.json
      - name: Build and unit checks
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android WSS and terminal acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd apps/android
            ./gradlew connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/kr.flownote.remote/files/ screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            apps/android/app/build/reports/
            apps/android/screenshots/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/remote-android-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Build signed APK
        env:
          REMOTE_ANDROID_KEYSTORE_BASE64: ${{ secrets.REMOTE_ANDROID_KEYSTORE_BASE64 }}
          REMOTE_ANDROID_SIGNING_PASSWORD: ${{ secrets.REMOTE_ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$REMOTE_ANDROID_KEYSTORE_BASE64"
          export REMOTE_ANDROID_KEYSTORE="$RUNNER_TEMP/remote-android.jks"
          printf '%s' "$REMOTE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$REMOTE_ANDROID_KEYSTORE"
          chmod 600 "$REMOTE_ANDROID_KEYSTORE"
          npm ci --prefix apps/android/terminal
          npm run build --prefix apps/android/terminal
          cd apps/android
          ./gradlew assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/flownote-remote-${GITHUB_REF_NAME#remote-android-}.apk"
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apps/android/release/* --notes-file apps/android/RELEASE_NOTES.md --title "Flownote Remote Android ${GITHUB_REF_NAME#remote-android-v}"
