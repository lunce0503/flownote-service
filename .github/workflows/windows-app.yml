name: Flownote Windows App
on:
  push:
    branches: [main, 'release/windows-*']
    tags: ['windows-v*']
    paths: ['flownote-desktop/**', '.github/workflows/windows-app.yml']
  pull_request:
    paths: ['flownote-desktop/**', '.github/workflows/windows-app.yml']
  workflow_dispatch:
    inputs:
      verify_updates:
        description: 'Download and verify the signed staging release feed and actual installer/portable assets'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flownote-desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: flownote-desktop/package-lock.json
      - run: npm ci
      - name: Package installer and portable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:win
      - name: Install and exercise the exact release application on Windows
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $setup = Join-Path $PWD "release/Flownote-Setup-$version-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'FlownoteInstalled'
          $installer = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $app = Join-Path $installDir 'Flownote.exe'
          if (!(Test-Path $app)) { throw 'Installed executable missing' }
          if (!(Test-Path (Join-Path $installDir 'resources/installed-by-nsis'))) { throw 'NSIS update mode marker missing' }
          npm run smoke -- "$app"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke failed' }
          $portableDir = Join-Path $env:RUNNER_TEMP 'FlownotePortable'
          Expand-Archive "release/Flownote-Portable-$version-x64.zip" $portableDir
          npm run smoke -- (Join-Path $portableDir 'Flownote.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Portable app smoke failed' }
      - name: Verify automatic downloads from the signed staging feed
        if: inputs.verify_updates == true
        run: node scripts/update-smoke.cjs "$env:RUNNER_TEMP/FlownoteInstalled/Flownote.exe" "$env:RUNNER_TEMP/FlownotePortable/Flownote.exe"
      - name: Upload tested binaries
        uses: actions/upload-artifact@v4
        with:
          name: flownote-windows-x64
          path: |
            flownote-desktop/release/Flownote-Setup-*.exe
            flownote-desktop/release/Flownote-Portable-*.zip
            flownote-desktop/release/SHA256SUMS.txt
          retention-days: 14
      - name: Upload application screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-screen
          path: flownote-desktop/test-output/*.png
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: flownote-windows-x64
          path: release
      - name: Validate release version and artifact hashes
        working-directory: release
        run: |
          test "$GITHUB_REF_NAME" = "windows-v$(node -p "require('../flownote-desktop/package.json').version")"
          sha256sum -c SHA256SUMS.txt
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Flownote-Setup-*.exe release/Flownote-Portable-*.zip release/SHA256SUMS.txt --verify-tag --latest=false --title "Flownote Windows ${GITHUB_REF_NAME#windows-v}" --notes-file flownote-desktop/RELEASE_NOTES.md
