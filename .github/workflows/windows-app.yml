name: Flownote Windows App
on:
  push:
    branches: [main, 'release/windows-*']
    tags: ['windows-v*']
    paths: ['flownote-desktop/**', '.github/workflows/windows-app.yml']
  pull_request:
    paths: ['flownote-desktop/**', '.github/workflows/windows-app.yml']
  workflow_dispatch:
    inputs:
      verify_updates:
        description: 'Download and verify the signed staging release feed and actual installer/portable assets'
        type: boolean
        default: false
      update_only:
        description: 'Verify exact published binaries without rebuilding or writing cloud test data'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    if: inputs.update_only != true
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flownote-desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: flownote-desktop/package-lock.json
      - run: npm ci
      - name: Package installer and portable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:win
      - name: Install and exercise the exact release application on Windows
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $setup = Join-Path $PWD "release/Flownote-Setup-$version-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'FlownoteInstalled'
          $installer = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $app = Join-Path $installDir 'Flownote.exe'
          if (!(Test-Path $app)) { throw 'Installed executable missing' }
          if (!(Test-Path (Join-Path $installDir 'resources/installed-by-nsis'))) { throw 'NSIS update mode marker missing' }
          npm run smoke -- "$app"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke failed' }
          $portableDir = Join-Path $env:RUNNER_TEMP 'FlownotePortable'
          Expand-Archive "release/Flownote-Portable-$version-x64.zip" $portableDir
          npm run smoke -- (Join-Path $portableDir 'Flownote.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Portable app smoke failed' }
      - name: Verify automatic downloads from the signed staging feed
        if: inputs.verify_updates == true
        run: node scripts/update-smoke.cjs "$env:RUNNER_TEMP/FlownoteInstalled/Flownote.exe" "$env:RUNNER_TEMP/FlownotePortable/Flownote.exe"
      - name: Upload tested binaries
        uses: actions/upload-artifact@v4
        with:
          name: flownote-windows-x64
          path: |
            flownote-desktop/release/Flownote-Setup-*.exe
            flownote-desktop/release/Flownote-Portable-*.zip
            flownote-desktop/release/SHA256SUMS.txt
          retention-days: 14
      - name: Upload application screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-screen
          path: flownote-desktop/test-output/*.png
          if-no-files-found: ignore
  updates:
    if: inputs.update_only == true
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flownote-desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: flownote-desktop/package-lock.json
      - run: npm ci
      - name: Download and install exact already-published release binaries
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $base = "https://github.com/lunce0503/flownote-service/releases/download/windows-v$version"
          foreach ($name in @("Flownote-Setup-$version-x64.exe", "Flownote-Portable-$version-x64.zip", 'SHA256SUMS.txt')) {
            Invoke-WebRequest "$base/$name" -OutFile "release/$name"
          }
          $lines = Get-Content release/SHA256SUMS.txt
          if ($lines.Length -ne 2) { throw 'Expected exactly two verified release artifacts' }
          foreach ($line in $lines) {
            $hash, $name = $line -split '  ', 2
            if ($name -notin @("Flownote-Setup-$version-x64.exe", "Flownote-Portable-$version-x64.zip")) { throw 'Unexpected artifact' }
            if ((Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw 'Published checksum mismatch' }
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'FlownoteInstalled'
          $oldName = 'Flownote-Setup-1.0.0-x64.exe'
          $oldBase = 'https://github.com/lunce0503/flownote-service/releases/download/windows-v1.0.0'
          Invoke-WebRequest "$oldBase/$oldName" -OutFile "release/$oldName"
          $oldSums = (Invoke-WebRequest "$oldBase/SHA256SUMS.txt").Content
          $oldLine = ($oldSums -split "`n" | Where-Object { $_ -match '^[a-f0-9]{64}  Flownote-Setup-1\.0\.0-x64\.exe\s*$' })
          if (!$oldLine -or (Get-FileHash "release/$oldName" -Algorithm SHA256).Hash.ToLower() -ne ($oldLine -split '  ')[0]) { throw 'Previous installer checksum mismatch' }
          $oldInstaller = Start-Process -FilePath "release/$oldName" -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($oldInstaller.ExitCode -ne 0) { throw 'Previous installer failed' }
          $profileDir = Join-Path $env:APPDATA 'Flownote-Staging'
          New-Item -ItemType Directory -Path $profileDir -Force | Out-Null
          $probe = Join-Path $profileDir 'native-upgrade-preservation-probe.txt'
          Set-Content $probe 'preserved'
          $installer = Start-Process -FilePath "release/Flownote-Setup-$version-x64.exe" -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw 'Installer failed' }
          if ((Get-Content $probe) -ne 'preserved') { throw 'Existing staging profile was changed during installer upgrade' }
          if (!(Test-Path (Join-Path $installDir 'resources/installed-by-nsis'))) { throw 'Installed update mode marker missing' }
          Expand-Archive "release/Flownote-Portable-$version-x64.zip" (Join-Path $env:RUNNER_TEMP 'FlownotePortable')
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'FlownotePortable/resources/installed-by-nsis')) { throw 'Portable package must not use NSIS update mode' }
      - name: Verify actual packaged Electron auto-download and cache
        run: node scripts/update-smoke.cjs "$env:RUNNER_TEMP/FlownoteInstalled/Flownote.exe" "$env:RUNNER_TEMP/FlownotePortable/Flownote.exe"
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: flownote-windows-x64
          path: release
      - name: Validate release version and artifact hashes
        working-directory: release
        run: |
          test "$GITHUB_REF_NAME" = "windows-v$(node -p "require('../flownote-desktop/package.json').version")"
          sha256sum -c SHA256SUMS.txt
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Flownote-Setup-*.exe release/Flownote-Portable-*.zip release/SHA256SUMS.txt --verify-tag --latest=false --title "Flownote Windows ${GITHUB_REF_NAME#windows-v}" --notes-file flownote-desktop/RELEASE_NOTES.md
