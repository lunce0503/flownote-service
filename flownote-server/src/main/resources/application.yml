server:
  port: ${PORT:${SERVER_PORT:8080}}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/javascript,text/html,text/xml,text/plain,text/css,text/event-stream

spring:
  application:
    name: flownote-server
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:flownote}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:60000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:0}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:2000}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis.railway.internal}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:500ms}
  servlet:
    multipart:
      max-file-size: ${FLOWNOTE_MAX_UPLOAD_FILE_SIZE:50MB}
      max-request-size: ${FLOWNOTE_MAX_UPLOAD_REQUEST_SIZE:60MB}
  flyway:
    baseline-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Redis는 세션 캐시(무음 폴백) 용도라 필수 의존성이 아니다.
    # Redis 장애/지연이 /actuator/health 를 DOWN 시키면 Railway 헬스체크 실패 →
    # 게이트웨이 502 → 로그인 불가로 이어지므로 전체 health 게이팅에서 제외한다.
    redis:
      enabled: false

flownote:
  cors:
    origins: ${CORS_ORIGINS:}
  mobile:
    core-api-url: ${MOBILE_CORE_API_URL}
    ai-api-url: ${MOBILE_AI_API_URL}
    web-url: ${MOBILE_WEB_URL}
    minimum-supported-version: ${MOBILE_MIN_SUPPORTED_VERSION:1.0.0}
    enabled-features: ${MOBILE_ENABLED_FEATURES:webview,auth,tasks,notes,canvas,agent}
